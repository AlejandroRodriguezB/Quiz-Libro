<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>El libro que te ha elegido</title>
    <style>
      @font-face {
        font-family: pmdFont;
        src: url("./pkmn-font.ttf");
      }
      * {
        box-sizing: border-box;
        font-family: pmdFont, system-ui, sans-serif;
      }
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: #000;
        color: #fff;
        overflow: hidden;
      }
      button {
        font: inherit;
        color: inherit;
        cursor: pointer;
      }
      .bgLayer {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #05070b;
        z-index: 0;
      }
      .bgLayer {
        background-image: url("./img/others/dreambackloop.png");
        background-size: cover;
        background-position: center;
      }
      .bgLayer img {
        display: block;
        position: absolute;
        min-width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center;
        pointer-events: none;
        z-index: 1;
      }
      .bgBack {
        opacity: 0.95;
        animation: driftBack 180s linear infinite;
      }
      .bgFront {
        opacity: 0.5;
        animation: driftFront 120s linear infinite;
        mix-blend-mode: screen;
      }
      @keyframes driftBack {
        from {
          transform: scale(1.05) translateX(0);
        }
        to {
          transform: scale(1.05) translateX(-3%);
        }
      }
      @keyframes driftFront {
        from {
          transform: scale(1.08) translateX(-3%);
        }
        to {
          transform: scale(1.08) translateX(3%);
        }
      }
      .shade {
        position: absolute;
        z-index: 3;
        inset: 0;
        background: radial-gradient(circle at center, rgba(15, 20, 30, 0.1), rgba(0, 0, 0, 0.72));
      }
      .screen {
        position: relative;
        z-index: 2;
        width: 100vw;
        height: 100vh;
        padding: 4vh 4vw;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        text-align: center;
        overflow: auto;
      }
      .panel {
        background: rgba(12, 14, 19, 0.82);
        backdrop-filter: blur(5px);
        border: 12px solid transparent;
        border-image: url("./img/others/pmdtextbox.png") 43 round;
        border-radius: 10px;
        padding: 18px;
        box-shadow: 0 8px 38px rgba(0, 0, 0, 0.5);
      }
      h1 {
        font-size: clamp(1.45rem, 4vw, 3.15rem);
        margin: 0.25em 0;
      }
      h2 {
        font-size: clamp(1.3rem, 3vw, 2.4rem);
        margin: 0.25em 0;
      }
      .sub {
        opacity: 0.8;
        font-size: clamp(1rem, 2vw, 1.45rem);
      }
      .intro {
        width: min(980px, 94vw);
        line-height: 1.65;
        font-size: clamp(1rem, 2vw, 1.35rem);
        text-align: left;
        cursor: pointer;
      }
      .intro p {
        margin: 0.8em 0;
      }
      .intro .quote {
        font-style: italic;
        text-align: center;
        color: #f4e9c9;
        margin: 1.1em auto;
        max-width: 800px;
      }
      .intro strong {
        color: #fff;
      }
      .continue {
        margin-top: 22px;
        text-align: center;
        opacity: 0.8;
        animation: blink 1.3s ease-in-out infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0.3;
        }
      }
      .modeGrid {
        display: grid;
        grid-template-columns: repeat(2, minmax(220px, 1fr));
        gap: 18px;
        width: min(900px, 94vw);
      }
      .mode {
        min-height: 130px;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        transition:
          transform 0.2s,
          filter 0.2s;
      }
      .mode:hover {
        transform: translateY(-5px) scale(1.015);
        filter: brightness(1.12);
      }
      .mode small {
        opacity: 0.7;
        margin-top: 7px;
      }
      .answers {
        width: min(760px, 94vw);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }
      .qtitle {
        width: min(1050px, 94vw);
        margin-bottom: 12px;
      }
      .answer {
        width: min(700px, 88vw);
        min-height: 58px;
        transition: 0.2s;
        font-size: clamp(0.95rem, 1.8vw, 1.25rem);
      }
      .answer:hover {
        transform: scale(1.025);
        filter: brightness(1.15);
      }
      .answer.selected {
        transform: scale(1.06);
      }
      .answer.disabled {
        filter: brightness(0.45);
      }
      .progress {
        position: fixed;
        top: 15px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 4;
        opacity: 0.7;
        font-size: 0.9rem;
      }
      .nature {
        padding: 30px;
        width: min(900px, 94vw);
        font-size: clamp(1rem, 2.2vw, 1.55rem);
        line-height: 1.5;
      }
      .tap {
        position: absolute;
        bottom: 5%;
        opacity: 0.7;
      }
      .arrow {
        width: 0;
        height: 0;
        border-left: 9px solid transparent;
        border-right: 9px solid transparent;
        border-top: 9px solid rgba(255, 255, 255, 0.7);
        animation: pulse 1s infinite;
      }
      @keyframes pulse {
        50% {
          opacity: 0.2;
        }
      }
      .result {
        display: grid;
        grid-template-columns: minmax(320px, 1fr) minmax(320px, 1fr);
        width: min(1250px, 96vw);
        height: min(90vh, 900px);
        gap: 20px;
      }
      .resultSide {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 18px;
        overflow: auto;
      }
      .resultTitle {
        font-size: clamp(1.35rem, 3vw, 2.5rem);
        margin-bottom: 16px;
      }
      .bookCard {
        width: min(420px, 80vw);
        padding: 18px 18px 22px;
        background: linear-gradient(145deg, rgba(25, 27, 35, 0.95), rgba(5, 7, 11, 0.92));
        border-radius: 14px;
        box-shadow:
          0 18px 55px rgba(0, 0, 0, 0.6),
          0 0 35px rgba(215, 190, 120, 0.1);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .coverFrame {
        position: relative;
        margin: auto;
        width: min(300px, 68vw);
        aspect-ratio: 2/3;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .cover {
        max-width: 100%;
        max-height: 100%;
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 3px;
        box-shadow: 0 18px 30px rgba(0, 0, 0, 0.55);
        transition: transform 0.5s;
      }
      .cover:hover {
        transform: translateY(-5px) rotate(-0.6deg);
      }
      .bookTitle {
        font-size: clamp(1.2rem, 2.4vw, 2rem);
        line-height: 1.2;
        margin: 18px 0 4px;
      }
      .author {
        font-size: clamp(0.95rem, 1.7vw, 1.25rem);
        opacity: 0.78;
      }
      .isbn {
        font-size: 0.78rem;
        opacity: 0.4;
        margin-top: 8px;
      }
      .restart {
        margin-top: 18px;
        padding: 10px 22px;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 8px;
      }
      .restart:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      .chartWrap {
        width: min(610px, 92vw);
        height: min(610px, 75vh);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .chart {
        width: 100%;
        height: 100%;
      }
      .chart polygon {
        fill: rgba(255, 255, 255, 0.12);
        stroke: rgba(255, 255, 255, 0.55);
        stroke-width: 2;
      }
      .chart line {
        stroke: rgba(255, 255, 255, 0.28);
        stroke-width: 1;
      }
      .chart text {
        fill: rgba(255, 255, 255, 0.9);
        font-family: pmdFont;
        font-size: 12px;
        text-anchor: middle;
      }
      .bookHint {
        opacity: 0.65;
        font-size: 0.85rem;
        margin-top: 10px;
      }
      @media (max-width: 800px) {
        .screen {
          padding: 3vh 3vw;
        }
        .modeGrid {
          grid-template-columns: 1fr;
        }
        .result {
          grid-template-columns: 1fr;
          width: 96vw;
          height: 94vh;
          overflow: auto;
        }
        .resultSide {
          min-height: auto;
        }
        .resultSide.chartSide {
          display: none;
        }
        .coverFrame {
          width: min(250px, 60vw);
        }
        .bookCard {
          width: min(390px, 88vw);
        }
        .intro {
          font-size: 1rem;
        }
        .intro .quote {
          font-size: 0.95rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="bgLayer">
      <img class="bgBack" src="/public/img/others/dreambackloop.png" /><img
        class="bgFront" src="/public/img/others/dreamfrontloop.png"/>
      <div class="shade"></div>
    </div>
    <audio id="music" src="/public/audio/quiz-music.ogg" loop preload="auto"></audio>
    <audio id="clickSound" src="/public/audio/select-sound.mp3" preload="auto"></audio>
    <div id="app"></div>
    <script>
      const QUESTIONS = [
        {
          id: 0,
          title: "Imagina que participas en un maratón y en la línea de salida te caes de cabeza. ¿Qué haces?",
          responses: [
            {
              response: "¡Es pronto para rendirse!",
              scores: [
                { nature: "Fuerte", points: 4 },
                { nature: "Osada", points: 2 },
              ],
              id: 0,
            },
            { response: "Dejo de correr", scores: [{ nature: "Rara", points: 4 }], id: 1 },
            {
              response: "¡Hay que repetir la salida!",
              scores: [
                { nature: "Alocada", points: 2 },
                { nature: "Audaz", points: 4 },
              ],
              id: 2,
            },
          ],
        },
        {
          id: 1,
          title: "¿Qué clase de película irías a ver al cine?",
          responses: [
            {
              response: "Una de acción",
              scores: [
                { nature: "Agitada", points: 4 },
                { nature: "Grosera", points: 2 },
              ],
              id: 0,
            },
            { response: "Un drama", scores: [{ nature: "Fuerte", points: 4 }], id: 1 },
            { response: "Una romántica", scores: [{ nature: "Rara", points: 4 }], id: 2 },
          ],
        },
        {
          id: 2,
          title: "¿Qué clase de estudiante eres?",
          responses: [
            { response: "De los que estudian a diario", scores: [{ nature: "Fuerte", points: 4 }], id: 0 },
            {
              response: "De los que estudian si se acuerdan",
              scores: [
                { nature: "Activa", points: 2 },
                { nature: "Rara", points: 4 },
              ],
              id: 1,
            },
            { response: "De los que estudian lo justo", scores: [{ nature: "Mansa", points: 2 }], id: 2 },
            { response: "Voy a necesitar ayuda...", scores: [{ nature: "Huraña", points: 4 }], id: 3 },
          ],
        },
        {
          id: 3,
          title: "¿Qué haces cuando tienes una tarea complicada por delante?",
          responses: [
            {
              response: "La hago sin rechistar",
              scores: [
                { nature: "Fuerte", points: 4 },
                { nature: "Osada", points: 2 },
              ],
              id: 0,
            },
            { response: "Pido ayuda", scores: [{ nature: "Dócil", points: 2 }], id: 1 },
            {
              response: "Que la haga otro",
              scores: [
                { nature: "Grosera", points: 2 },
                { nature: "Audaz", points: 4 },
              ],
              id: 2,
            },
          ],
        },
        {
          id: 4,
          title: "¿Te disculpas siempre de todo corazón?",
          responses: [
            {
              response: "Por supuesto",
              scores: [
                { nature: "Dócil", points: 4 },
                { nature: "Audaz", points: 2 },
              ],
              id: 0,
            },
            {
              response: "Hombre, nunca es fácil",
              scores: [
                { nature: "Miedosa", points: 4 },
                { nature: "Huraña", points: 2 },
              ],
              id: 1,
            },
          ],
        },
        {
          id: 5,
          title: "¿Estudias con regularidad?",
          responses: [
            { response: "Sí", scores: [{ nature: "Dócil", points: 4 }], id: 0 },
            {
              response: "Bueno...",
              scores: [
                { nature: "Ingenua", points: 4 },
                { nature: "Alocada", points: 2 },
              ],
              id: 1,
            },
            { response: "¡Lo mío es el deporte!", scores: [{ nature: "Agitada", points: 4 }], id: 2 },
          ],
        },
        {
          id: 6,
          title: "Se rumorea que hay un fantasma en los servicios de la escuela. ¿Qué haces?",
          responses: [
            {
              response: "Mejor no ir al baño",
              scores: [
                { nature: "Dócil", points: 4 },
                { nature: "Miedosa", points: 2 },
              ],
              id: 0,
            },
            {
              response: "Voy a ver qué pasa",
              scores: [
                { nature: "Alegre", points: 4 },
                { nature: "Plácida", points: 2 },
                { nature: "Audaz", points: 2 },
              ],
              id: 1,
            },
          ],
        },
        {
          id: 7,
          title: "Imagina que todos habéis tomado postre y todavía queda una porción. ¿Qué haces?",
          responses: [
            {
              response: "A ver si no se dan cuenta...",
              scores: [
                { nature: "Miedosa", points: 2 },
                { nature: "Audaz", points: 4 },
              ],
              id: 0,
            },
            {
              response: "La echamos a suertes",
              scores: [
                { nature: "Dócil", points: 4 },
                { nature: "Alocada", points: 4 },
              ],
              id: 1,
            },
            { response: "¡Tonto el último!", scores: [{ nature: "Agitada", points: 4 }], id: 2 },
          ],
        },
        {
          id: 8,
          title: "¿Cómo te levantas?",
          responses: [
            {
              response: "¡A toda pastilla!",
              scores: [
                { nature: "Osada", points: 4 },
                { nature: "Agitada", points: 4 },
              ],
              id: 0,
            },
            { response: "Como una rosa", scores: [{ nature: "Mansa", points: 2 }], id: 1 },
            {
              response: "Con sueño, pero bien",
              scores: [
                { nature: "Dócil", points: 2 },
                { nature: "Miedosa", points: 4 },
              ],
              id: 2,
            },
          ],
        },
        {
          id: 9,
          title: "Imagina que todo el mundo se está riendo por algo que a ti te parece bastante aburrido. ¿Qué haces?",
          responses: [
            {
              response: "¿Qué voy a hacer?",
              scores: [
                { nature: "Osada", points: 4 },
                { nature: "Audaz", points: 2 },
              ],
              id: 0,
            },
            {
              response: "Les sigo el rollo",
              scores: [
                { nature: "Miedosa", points: 2 },
                { nature: "Huraña", points: 4 },
              ],
              id: 1,
            },
            {
              response: "Depende de la situación",
              scores: [
                { nature: "Rara", points: 2 },
                { nature: "Mansa", points: 2 },
              ],
              id: 2,
            },
          ],
        },
        {
          id: 10,
          title: "Alguien te gusta un montón y se lo quieres decir. ¿Qué haces?",
          responses: [
            {
              response: "Lo muestro haciéndole más caso",
              scores: [
                { nature: "Alegre", points: 4 },
                { nature: "Mansa", points: 2 },
              ],
              id: 0,
            },
            {
              response: "Evidente, le tomo un poco el pelo",
              scores: [
                { nature: "Ingenua", points: 2 },
                { nature: "Huraña", points: 4 },
              ],
              id: 1,
            },
            {
              response: "¡Lo grito a los cuatro vientos!",
              scores: [
                { nature: "Osada", points: 4 },
                { nature: "Agitada", points: 4 },
                { nature: "Audaz", points: 2 },
              ],
              id: 2,
            },
            { response: "No se lo digo. ¡Qué vergüenza!", scores: [{ nature: "Miedosa", points: 2 }], id: 3 },
          ],
        },
        {
          id: 11,
          title:
            "Estás dando un paseo y de repente te llaman para hacerte una entrevista para la televisión. ¿Qué haces?",
          responses: [
            { response: "¿Huyo? ¡Qué vergüenza!", scores: [{ nature: "Miedosa", points: 4 }], id: 0 },
            {
              response: "Respondo a las preguntas",
              scores: [
                { nature: "Osada", points: 4 },
                { nature: "Grosera", points: 4 },
              ],
              id: 1,
            },
            {
              response: "¡Yuju! ¡Estoy en la tele!",
              scores: [
                { nature: "Ingenua", points: 4 },
                { nature: "Audaz", points: 2 },
              ],
              id: 2,
            },
          ],
        },
        {
          id: 12,
          title: "¿Te gustan las fiestas con marcha?",
          responses: [
            {
              response: "¡Claro!",
              scores: [
                { nature: "Alegre", points: 4 },
                { nature: "Huraña", points: 2 },
              ],
              id: 0,
            },
            { response: "Paso...", scores: [{ nature: "Mansa", points: 2 }], id: 1 },
          ],
        },
        {
          id: 13,
          title: "Le están cantando cumpleaños feliz a alguien de la mesa de al lado. ¿Qué haces?",
          responses: [
            { response: "Me quedo y lo veo", scores: [{ nature: "Serena", points: 2 }], id: 0 },
            {
              response: "Me uno a la canción",
              scores: [
                { nature: "Alegre", points: 4 },
                { nature: "Ingenua", points: 4 },
              ],
              id: 1,
            },
            {
              response: "Me marcho",
              scores: [
                { nature: "Grosera", points: 4 },
                { nature: "Huraña", points: 2 },
              ],
              id: 2,
            },
          ],
        },
        {
          id: 14,
          title:
            "Estás en medio de una reunión en la que todo el mundo está en silencio cuando oyes como alguien se tira un pedo. ¿Cómo reaccionas?",
          responses: [
            {
              response: "¡Me parto de risa!",
              scores: [
                { nature: "Alegre", points: 4 },
                { nature: "Ingenua", points: 4 },
              ],
              id: 0,
            },
            {
              response: "Hago oídos sordos...",
              scores: [
                { nature: "Dócil", points: 2 },
                { nature: "Agitada", points: 2 },
              ],
              id: 1,
            },
            { response: "¿¿Quién ha sido??", scores: [{ nature: "Osada", points: 4 }], id: 2 },
          ],
        },
        {
          id: 15,
          title: "¿Te gusta el karaoke?",
          responses: [
            {
              response: "¡Claro!",
              scores: [
                { nature: "Alegre", points: 4 },
                { nature: "Audaz", points: 4 },
              ],
              id: 0,
            },
            {
              response: "No",
              scores: [
                { nature: "Dócil", points: 2 },
                { nature: "Miedosa", points: 2 },
              ],
              id: 1,
            },
          ],
        },
        {
          id: 16,
          title: "¿Prefieres jugar fuera de casa en lugar de dentro?",
          responses: [
            {
              response: "Sí",
              scores: [
                { nature: "Agitada", points: 4 },
                { nature: "Alocada", points: 4 },

              id: 0,

            { response: "No", scores: [{ nature: "Serena", points: 2 }], id: 1 },

        {
          id: 17,

                { nature: "Grosera", points: 2 },

              id: 0,

        },
        {
          id: 18,
          title: "Estás en la montaña y llegas a un punto donde el camino se separa en dos. ¿Cuál escoges?",

              response: "El estrecho",
              scores: [
                { nature: "Agitada", points: 4 },
                { nature: "Ingenua", points: 2 },
              ],
              id: 0,
            },
            {
              response: "El ancho",
              scores: [
                { nature: "Miedosa", points: 2 },
                { nature: "Rara", points: 4 },
              ],
              id: 1,
            },
          ],
        },
        {
          id: 19,
          title: "Imagina que descubres un cofre hecho polvo en medio de unas ruinas. ¿Qué haces?",

            {
              response: "Lo abro",
              scores: [
                { nature: "Osada", points: 4 },
                { nature: "Agitada", points: 4 },
                { nature: "Activa", points: 4 },
                { nature: "Alocada", points: 2 },
              ],
              id: 0,
            },
            { response: "Pido ayuda", scores: [{ nature: "Miedosa", points: 2 }], id: 1 },
          ],
        },
        {
          id: 20,
          title: "Un amigo tropieza y se cae estrepitosamente. ¿Qué haces?",
          responses: [
            {
              response: "Ayudo a mi amigo",
              scores: [
                { nature: "Osada", points: 4 },
                { nature: "Huraña", points: 2 },
              ],
              id: 0,
            },
            {
              response: "¡Me río! ¡Es divertidísimo!",
              scores: [
                { nature: "Agitada", points: 4 },
                { nature: "Ingenua", points: 4 },
                { nature: "Alocada", points: 2 },
              ],
              id: 1,
            },
          ],
        },
        {
          id: 21,
          title: "Estás soñando despierto... y un amigo te tira agua encima. ¿Qué haces?",
          responses: [
            { response: "¡Me enfado!", scores: [{ nature: "Activa", points: 4 }], id: 0 },
            { response: "Me pongo triste", scores: [{ nature: "Huraña", points: 4 }], id: 1 },
            {
              response: "¡Yuju! ¡Pelea de agua!",
              scores: [
                { nature: "Alegre", points: 4 },
                { nature: "Agitada", points: 4 },
                { nature: "Ingenua", points: 4 },
              ],
              id: 2,
            },
          ],
        },

          "Eres una persona... ¡traviesa! ¡Cómo te gusta jugar con todo! ¡Y comer bien! Te encanta competir, pero no te gusta perder. Tu personalidad es transparente. Contigo, ¡ya se sabe lo que hay! Alegras a los demás con tu gran sonrisa. A veces temes mostrarte como eres y expresar tus sentimientos. No te lo guardes todo para ti. Pide consejo a tus amigos si lo necesitas. Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Ingenua:
          "Eres una persona... ¡ingenua! ¡Abierta e inocente! ¡También te suele picar la curiosidad! Das tu opinión siempre con naturalidad y dices exactamente lo que piensas. Tienes espíritu artístico y no te frenan las convenciones sociales. Asombras a la gente con tu espontaneidad. Si te pasas, a la gente puede costarle seguirte el ritmo... ¿Has notado que te miran de una manera rara? ¿Sin razón aparente? Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Miedosa:
          "Eres una persona... tímida. ¡Eres muy dulce! A veces sientes vergüenza, ¿verdad? E incluso puedes perderte nuevas experiencias porque la novedad es un reto para ti. Pero no siempre es malo ser prudente, ¿verdad? Al fin y al cabo, te mantiene a salvo. Vives la vida a tu ritmo, ¡sin prisas ni preocupaciones! Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Activa:
          "Eres una persona... ¡impaciente! ¡Hablas deprisa! ¡Comes deprisa! ¡Siempre a todo correr! ¡Todos piensan que trabajas mucho porque nunca te paras! Pero ten cuidado. Si te apresuras tanto, puedes equivocarte más a menudo que los demás. ¡Y sería una pena! ¡Relájate de vez en cuando! ¡Coge aire! Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Grosera:
          "Eres una persona... ¡atrevida! ¡O al menos a veces! No te gustan las órdenes. Eres un poco rebelde y te gusta llevar la contraria. ¡Eres un poco como un lobo solitario! Te gusta hacer las cosas por tu cuenta sin tener que estar pendiente de nadie. La gente mayor puede pensar que eres algo insolente e incluso egoísta. La gente joven, sin embargo, ¡te admira! Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Serena:
          "Eres una persona... ¡tranquila! Tienes gran consideración y antepones siempre el bienestar de tus amigos al tuyo. Tu bondad y generosidad te permiten reírte, perdonar y olvidar los errores de tus amigos. ¡Ve con cuidado! ¡Tu forma de ser puede relegarte demasiado! Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Plácida:
          "Eres una persona... ¡relajada! Eres informal, sin apenas preocupaciones. No te gusta correr ni estresarte, y nada te preocupa en exceso. ¡Te encanta sentarte y relajarte! ¡Y tanto! Tienes una personalidad bastante acomodadiza. ¡La gente acude a ti porque le gusta tu forma de ser! Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Huraña:
          "Eres una persona... solitaria, ¡o al menos a veces! ¿Por qué te sorprendes? ¿Acaso no es cierto? Pero, ya sabes lo que dicen... En el fondo todos necesitamos nuestro espacio. Aunque no mucha gente lo reconoce. Así que no lo vayas diciendo por ahí. Si hay algo que nos une... ¡es que todos tenemos que estar solos a veces! Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Rara: "Eres una persona... ¡extravagante! ¡Te encanta ir siempre a la moda! Siempre quieres tener lo último, ¿verdad? ¡Te aburres de lo viejo y solo quieres cosas nuevas! Eres fiel a tus emociones y sigues siempre tu voluntad. A la gente le cuesta entender que cambies tan rápido. Tal vez deberías reflexionar sobre cómo tus palabras y actos afectan a los demás. Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Mansa:
          "Eres una persona... ¡callada! ¡Y muy calmada! Se te dan bien los números y siempre analizas la situación antes de tomar una decisión. Pocas veces te equivocas, ya que decides con calma y tras razonar las cosas con lógica. A veces te cuesta saber lo que piensan los demás y la gente piensa que eres un poco insensible. Deberías expresar más tus sentimientos. Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Alocada:
          "Eres una persona... impulsiva. A veces, hasta un poco impaciente. Más de una vez has salido de casa y se te ha olvidado cerrar la puerta con llave. Y no haces más que perder paraguas. ¡Incluso hasta puedes haber salido a la calle en zapatillas de andar por casa! ¡Y qué me dices de las camisetas del revés! Bueno, ¡igual eso ha sido demasiado! ¡Perdona! ¡Que sepas que a tus amigos les encanta esta faceta tuya! Alguien como tú podría ser... ¡Espera! ¡Otra cosa! ¡A veces cuentas los secretos de tus amigos sin querer! ¡Perdona, pero tenía que decírtelo! Como iba diciendo...Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
        Audaz:
          "Eres una persona... ¡audaz! ¡Eres tan valiente que nunca te echas atrás! Aunque, a veces, tu osadía te hace pasarte un poco de la raya. No te da vergüenza llevarte a casa las sobras de la cena en el restaurante, ¿verdad? Si alguien te invita a cenar, ¡no te da ningún reparo pedir un montón de comida! No te desconcierta hacer cosas que otros se pensarían dos veces. ¡A veces ni te enteras de que has decepcionado a alguien! Tienes potencial para ser una gran persona... ¡porque nunca te rindes! Notas que el extraño libro que tenías en las manos ahora tiene una portada...",
      };
      const BOOKS = [
        { isbn: "9788491040255", title: "Confesiones de una máscara", author: "Yukio Mishima" },
        { isbn: "9788494468537", title: "El elogio de la sombra", author: "Junichirō Tanizaki" },
        { isbn: "9788419035769", title: "Indigno de ser humano", author: "Osamu Dazai" },
        { isbn: "9788430625628", title: "Vida contemplativa: Elogio de la inactividad", author: "Byung-Chul Han" },
        {
          isbn: "9789871622726",
          title: "Ausencia: acerca de la cultura y la filosofía en el Lejano Oriente",
          author: "Byung-Chul Han",
        },
        { isbn: "9788425441035", title: "Hegel y el poder: Un ensayo sobre la amabilidad", author: "Byung-Chul Han" },
        { isbn: "9788433905451", title: "La civilización inconsciente", author: "John Ralston Saul" },
        { isbn: "9788410404175", title: "Hay quien prefiere las ortigas", author: "Junichirō Tanizaki" },
        { isbn: "9788410404304", title: "Tormenta de flores", author: "Osamu Dazai" },
        { isbn: "9788419507266", title: "Momo", author: "Michael Ende" },
        { isbn: "9788491118145", title: "La metamorfosis", author: "Franz Kafka" },
        { isbn: "9788445020951", title: "Brujería para chicas descarriadas", author: "Grady Hendrix" },
        { isbn: "9788490669099", title: "La Policía de la Memoria", author: "Yoko Ogawa" },
        { isbn: "9788490669402", title: "El arco iris de gravedad", author: "Thomas Pynchon" },
        { isbn: "9788493937966", title: "La sombra fuera del tiempo", author: "H. P. Lovecraft" },
        { isbn: "9788483593363", title: "La sombra sobre Innsmouth", author: "H. P. Lovecraft" },
        { isbn: "9788466375696", title: "Cuando Alice se subió a la mesa", author: "Jonathan Lethem" },
        { isbn: "9788445007006", title: "El ojo del mundo", author: "Robert Jordan" },
        { isbn: "9788410466135", title: "Carl el Mazmorrero", author: "Matt Dinniman" },
        { isbn: "9788445019825", title: "Zangetsuki. Crónicas de la luna", author: "Masakuni Oda" },
        { isbn: "9788415130093", title: "Solaris", author: "Stanislaw Lem" },
        { isbn: "9791370136383", title: "Berserk Master Edition 1", author: "Kentaro Miura" },
        { isbn: "9788467972979", title: "Mujina Into the Deep 01. Edición especial", author: "Inio Asano" },
        { isbn: "9788412930627", title: "Bibliomania: Edición Deluxe", author: "Macchiro y Obaru" },
        { isbn: "9781910856161", title: "Barrio lejano. Edición definitiva", author: "Jirō Taniguchi" },
        { isbn: "9781908007438", title: "El perro enamorado de las estrellas", author: "Takashi Murakami" },
        { isbn: "9788467962789", title: "Buenas Noches, Punpun 01", author: "Inio Asano" },
        { isbn: "9788467963120", title: "Solanin", author: "Inio Asano" },
        { isbn: "9788416693535", title: "Parasyte nº 01/08", author: "Hitoshi Iwaaki" },
      ];
      const NATURE_BOOKS = {
        Fuerte: [0, 1],
        Dócil: [2, 3],
        Osada: [4, 5],
        Alegre: [6, 7],
        Agitada: [8, 9],
        Ingenua: [10, 11],
        Miedosa: [12, 13],
        Activa: [14, 15],
        Grosera: [16, 17],
        Serena: [18, 19],
        Plácida: [20, 21],
        Huraña: [22, 23],
        Rara: [24, 25],
        Mansa: [26],
        Alocada: [27],
        Audaz: [28],
      };
      const STRINGS = { ResultMessage: "El libro que parece haberte elegido es...", Restart: "Volver a empezar" };
      const app = document.getElementById("app"),
        music = document.getElementById("music"),
        clickSound = document.getElementById("clickSound");
      let selected = [],
        index = 0,
        points = {},
        maxPoints = {},
        bestNature = null,
        selectedChoice = false;
      function esc(s) {
        return String(s).replace(
          /[&<>"']/g,
          (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]
        );
      }
      function startMusic() {
        music.volume = 0.35;
        music.play().catch(() => {});
      }
      function click() {
        clickSound.currentTime = 0;
        clickSound.volume = 0.55;
        clickSound.play().catch(() => {});
      }
      function intro() {
        app.innerHTML = `<div class="screen"><div class="intro panel"><p>Una mañana despiertas en un lugar que no reconoces.</p><p>No sabes cómo has llegado hasta allí.</p><p>A tu alrededor hay un bosque cubierto de niebla. Entre los árboles puedes distinguir una silueta que parece observarte.</p><p>No llevas nada contigo salvo un extraño libro.</p><p>En su portada no aparece ningún título.</p><div class="quote"><p>«Los libros no siempre son elegidos por quienes los leen.»</p><p>«A veces son ellos quienes eligen a su lector.»</p></div><p>Para descubrir qué libro te ha elegido, tendrás que responder a las siguientes preguntas.</p><p>No existen respuestas correctas o incorrectas.</p><div class="continue">Haz clic para continuar ↓</div></div></div>`;
        document.querySelector(".intro").onclick = () => {
          startMusic();
          modes();
        };
      }
      function modes() {
        app.innerHTML = `<div class="screen"><div class="panel" style="margin-bottom:20px"><h1>El libro que te ha elegido</h1><div class="sub">¿Qué historia te estaba esperando?</div></div><div class="modeGrid"><button class="mode panel" id="normal"><h2>Descubrir mi libro</h2><small>10 preguntas · recomendado</small></button><button class="mode panel" id="full"><h2>Quiz completo</h2><small>64 preguntas · más preciso</small></button></div></div>`;
        document.getElementById("normal").onclick = () => {
          click();
          begin(10);
        };
        document.getElementById("full").onclick = () => {
          click();
          begin(64);
        };
      }
      function reset() {
        points = {};
        NATURES.forEach((n) => (points[n] = 0));
        maxPoints = {};
        NATURES.forEach((n) => (maxPoints[n] = 0));
        QUESTIONS.forEach((q) =>
          q.responses.forEach((a) => a.scores.forEach((s) => (maxPoints[s.nature] += s.points)))
        );
      }
      function begin(n) {
        startMusic();
        reset();
        selected = [];
        index = 0;
        if (n === 64) selected = [...QUESTIONS];
        else {
          let pool = [...QUESTIONS];
          while (selected.length < n) {
            let i = Math.floor(Math.random() * pool.length);
            selected.push(pool.splice(i, 1)[0]);
          }
        }
        showQuestion();
      }
      function showQuestion() {
        if (index >= selected.length) {
          showNature();
          return;
        }
        const q = selected[index];
        app.innerHTML = `<div class="screen"><div class="progress">Pregunta ${index + 1} de ${selected.length}</div><div class="qtitle panel"><h1>${esc(q.title)}</h1></div><div class="answers" id="answers"></div></div>`;
        const box = document.getElementById("answers");
        q.responses.forEach((a, i) => {
          const b = document.createElement("button");
          b.className = "answer panel";
          b.innerHTML = esc(a.response);
          b.onmouseenter = () => {
            [...box.children].forEach((x, j) => x.classList.toggle("disabled", j !== i && selectedChoice));
          };
          b.onmouseleave = () => {
            [...box.children].forEach((x) => x.classList.remove("disabled"));
          };
          b.onclick = () => {
            if (selectedChoice) return;
            selectedChoice = true;
            a.scores.forEach((s) => (points[s.nature] += s.points));
            b.classList.add("selected");
            click();
            [...box.children].forEach((x, j) => {
              if (j !== i) x.classList.add("disabled");
            });
            setTimeout(() => {
              selectedChoice = false;
              index++;
              showQuestion();
            }, 240);
          };
          box.appendChild(b);
        });
      }
      function weighted() {
        let w = {};
        NATURES.forEach((n) => (w[n] = maxPoints[n] ? points[n] / maxPoints[n] : 0));
        return w;
      }
      function getBest() {
        const w = weighted();
        let mx = Math.max(...NATURES.map((n) => w[n]));
        return NATURES.filter((n) => w[n] === mx)[0];
      }
      function showNature() {
        bestNature = getBest();
        let parts = DESCRIPTIONS[bestNature]
          .split(".")
          .map((x) => x.trim())
          .filter(Boolean)
          .map((x) => x + ".");
        let i = 0;
        function draw() {
          app.innerHTML = `<div class="screen" id="nature"><div class="nature panel">${esc(parts[i])}</div><div class="tap">Toca o haz clic para continuar<div class="arrow"></div></div></div>`;
          document.getElementById("nature").onclick = () => {
            click();
            i++;
            if (i >= parts.length) showResult();
            else draw();
          };
        }
        draw();
      }
      function coverSources(isbn) {
        return [
          `https://covers.openlibrary.org/b/isbn/${isbn}-L.jpg`,
          `https://images.weserv.nl/?url=covers.openlibrary.org/isbn/${isbn}-L.jpg`,
          `./covers/${isbn}.svg`,
        ];
      }
      function loadCover(img, book) {
        const sources = coverSources(book.isbn);
        let i = 0;
        function next() {
          if (i >= sources.length) {
            img.src = "./covers/" + book.isbn + ".svg";
            return;
          }
          img.src = sources[i++];
        }
        img.onerror = next;
        next();
      }
      function chooseBook() {
        const candidates = NATURE_BOOKS[bestNature] || BOOKS.map((_, i) => i);
        return BOOKS[candidates[Math.floor(Math.random() * candidates.length)]];
      }
      function showResult() {
        const book = chooseBook();
        const w = weighted();
        app.innerHTML = `<div class="screen"><div class="result"><div class="resultSide"><div class="resultTitle">${esc(STRINGS.ResultMessage)}</div><div class="bookCard"><div class="coverFrame"><img id="bookCover" class="cover" alt="Portada de ${esc(book.title)}"></div><div class="bookTitle">${esc(book.title)}</div><div class="author">${esc(book.author)}</div><div class="isbn">ISBN ${esc(book.isbn)}</div><div class="bookHint">Edición identificada mediante el ISBN proporcionado</div></div><button class="restart" id="restart">↻ ${esc(STRINGS.Restart)}</button></div><div class="resultSide chartSide"><div class="panel"><h2>Tu perfil</h2><div class="sub">Así ha respondido tu personalidad al cuestionario.</div><div class="chartWrap">${chartSvg(w)}</div></div></div></div></div>`;
        loadCover(document.getElementById("bookCover"), book);
        document.getElementById("restart").onclick = () => {
          click();
          modes();
        };
      }
      function chartSvg(w) {
        const cx = 300,
          cy = 300,
          r = 220,
          n = NATURES.length;
        let pts = [];
        for (let i = 0; i < n; i++) {
          let a = -Math.PI / 2 + (i * 2 * Math.PI) / n,
            rr = r * Math.max(0.08, w[NATURES[i]]);
          pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
        }
        let grid = "";
        for (let k = 1; k <= 4; k++) {
          let rr = (r * k) / 4,
            p = [];
          for (let i = 0; i < n; i++) {
            let a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
            p.push(`${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`);
          }
          grid += `<polygon points="${p.join(" ")}" style="fill:none;stroke:rgba(255,255,255,.2);stroke-width:1"/>`;
        }
        let lines = NATURES.map((name, i) => {
          let a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
          return `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}"/>`;
        }).join("");
        let labels = NATURES.map((name, i) => {
          let a = -Math.PI / 2 + (i * 2 * Math.PI) / n,
            rr = r + 38;
          return `<text x="${cx + rr * Math.cos(a)}" y="${cy + rr * Math.sin(a)}">${esc(name)}</text>`;
        }).join("");
        return `<svg class="chart" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">${grid}${lines}<polygon points="${pts.map((p) => p.join(",")).join(" ")}"/>${labels}</svg>`;
      }
      intro();
    </script>
  </body>
</html>
