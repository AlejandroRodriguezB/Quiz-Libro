      { isbn: "9788466375696", title: "Cuando Alice se subió a la mesa", author: "Jonathan Lethem", description: "Alice abandona a su pareja porque se enamora de Ausencia, un extraño agujero de gusano con personalidad propia. Una novela que mezcla ciencia ficción, humor, romance y reflexión sobre la existencia." },
      { isbn: "9788445007006", title: "El ojo del mundo", author: "Robert Jordan", description: "Rand Al'Thor y sus amigos deben huir de su pueblo después de que una misteriosa hechicera anuncie el regreso de una antigua amenaza. Es el comienzo de la extensa saga fantástica La Rueda del Tiempo." },
      { isbn: "9788410466135", title: "Carl el Mazmorrero", author: "Matt Dinniman", description: "Tras un apocalipsis alienígena, Carl y la gata de su exnovia deben sobrevivir en una gigantesca mazmorra que resulta ser el escenario de un reality show visto por espectadores de toda la galaxia." },
      { isbn: "9788445019825", title: "Zangetsuki. Crónicas de la luna", author: "Masakuni Oda", description: "La vida aparentemente perfecta de Takashi cambia cuando, durante una noche de luna llena, su familia deja de reconocerlo. Comienza entonces un viaje inquietante por mundos paralelos, identidades y recuerdos." },
      { isbn: "9788415130093", title: "Solaris", author: "Stanislaw Lem", description: 'Un grupo de científicos estudia un planeta cubierto por un océano misterioso que parece tener conciencia. La novela reflexiona sobre la imposibilidad de comprender completamente lo desconocido y sobre los recuerdos y deseos humanos."' },
      { isbn: "9791370136383", title: "Berserk Master Edition 1", author: "Kentaro Miura", description: 'Edición que reúne los tres primeros volúmenes de Berserk. Sigue a Guts en un mundo de fantasía oscura lleno de violencia, monstruos, guerras y destinos marcados por la tragedia.' },
      { isbn: "9788467972979", title: "Mujina Into the Deep 01. Edición especial", author: "Inio Asano", description: "Mujina es una joven mercenaria que trabaja eliminando objetivos en una enorme ciudad mientras vive al margen de la sociedad. Una historia de acción y ciencia ficción con la particular mirada de Asano." },
      { isbn: "9788412930627", title: "Bibliomania: Edición Deluxe", author: "Macchiro y Obaru", description: "Alice despierta en la habitación 431 de una misteriosa residencia donde todos sus deseos pueden hacerse realidad. Al intentar escapar, descubre que aquel mundo aparentemente perfecto esconde una realidad inquietante." },
      { isbn: "9781910856161", title: "Barrio lejano. Edición definitiva", author: "Jirō Taniguchi", description: "UUn hombre adulto regresa accidentalmente a su barrio natal y se encuentra transportado a su propia infancia. Con sus recuerdos adultos intactos, tiene la oportunidad de enfrentarse de nuevo a acontecimientos de su pasado." },
      { isbn: "9781908007438", title: "El perro enamorado de las estrellas", author: "Takashi Murakami", description: "Un hombre que ha perdido a su familia y su rumbo emprende un viaje por carretera acompañado de un perro. Una historia emotiva sobre la amistad, la soledad, la lealtad y las segundas oportunidades." },
      { isbn: "9788467962789", title: "Buenas Noches, Punpun 01", author: "Inio Asano", description: "Punpun es un adolescente que atraviesa los problemas del crecimiento, el amor, el sexo y una complicada situación familiar. Una historia de madurez marcada por la melancolía y una visión cruda de la vida." },
      { isbn: "9788467963120", title: "Solanin", author: "Inio Asano", description: "Meiko y Taneda son dos jóvenes que intentan descubrir qué quieren hacer con sus vidas después de terminar sus estudios. Una historia sobre la juventud, los sueños, las dudas y el miedo al futuro." },
      { isbn: "9788416693535", title: "Parasyte nº 01/08", author: "Hitoshi Iwaaki", description: "Unos organismos extraterrestres invaden la Tierra y comienzan a apoderarse de cuerpos humanos. Shinichi consigue evitar que uno controle su cerebro, pero el parásito termina instalado en su mano, obligándolo a luchar por sobrevivir." },
    ];
    const NATURE_BOOKS = {
      Fuerte: [0, 1],
      Dócil: [2, 3],
      Osada: [4, 5],
      Alegre: [6, 7],
      Agitada: [8, 9],
      Ingenua: [10, 11],
      Miedosa: [12, 13],
      Activa: [14, 15],
      Grosera: [16, 17],
      Serena: [18, 19],
      Plácida: [20, 21],
      Huraña: [22, 23],
      Rara: [24, 25],
      Mansa: [26],
      Alocada: [27],
      Audaz: [28],
    };
    const STRINGS = { ResultMessage: "El libro que parece haberte elegido es...", Restart: "Volver a empezar" };
    const app = document.getElementById("app"),
      music = document.getElementById("music"),
      clickSound = document.getElementById("clickSound");
    let selected = [],
      index = 0,
      points = {},
      maxPoints = {},
      bestNature = null,
      selectedChoice = false;
    function esc(s) {
      return String(s).replace(
        /[&<>"']/g,
        (m) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[m]
      );
    }
    function startMusic() {
      music.volume = 0.35;
      music.play().catch(() => { });
    }
    function click() {
      clickSound.currentTime = 0;
      clickSound.volume = 0.55;
      clickSound.play().catch(() => { });
    }
    function intro() {
      app.innerHTML = `<div class="screen"><div class="intro panel"><p>Una mañana despiertas en un lugar que no reconoces.</p><p>No sabes cómo has llegado hasta allí.</p><p>A tu alrededor hay un bosque cubierto de niebla. Entre los árboles puedes distinguir una silueta que parece observarte.</p><p>No llevas nada contigo salvo un extraño libro.</p><p>En su portada no aparece ningún título.</p><div class="quote"><p>«Los libros no siempre son elegidos por quienes los leen.»</p><p>«A veces son ellos quienes eligen a su lector.»</p></div><p>Para descubrir qué libro te ha elegido, tendrás que responder a las siguientes preguntas.</p><p>No existen respuestas correctas o incorrectas.</p><div class="continue">Haz clic para continuar ↓</div></div></div>`;
      document.querySelector(".intro").onclick = () => {
        startMusic();
        modes();
      };
    }
    function modes() {
      app.innerHTML = `<div class="screen"><div class="panel" style="margin-bottom:20px"><h1>Puedes buscar una respuesta </h1><div class="sub">o dejar que te encuentre</div></div><div class="modeGrid"><button class="mode panel" id="normal"><h2>Buscar una respuesta</h2><small>10 preguntas · recomendado</small></button><button class="mode panel" id="full"><h2>Dejar que te encuentre</h2><small>64 preguntas · más preciso</small></button></div></div>`;
      document.getElementById("normal").onclick = () => {
        click();
        begin(10);
      };
      document.getElementById("full").onclick = () => {
        click();
        begin(64);
      };
    }
    function reset() {
      points = {};
      NATURES.forEach((n) => (points[n] = 0));
      maxPoints = {};
      NATURES.forEach((n) => (maxPoints[n] = 0));
      QUESTIONS.forEach((q) =>
        q.responses.forEach((a) => a.scores.forEach((s) => (maxPoints[s.nature] += s.points)))
      );
    }
    function begin(n) {
      startMusic();
      reset();
      selected = [];
      index = 0;
      if (n === 64) selected = [...QUESTIONS];
      else {
        let pool = [...QUESTIONS];
        while (selected.length < n) {
          let i = Math.floor(Math.random() * pool.length);
          selected.push(pool.splice(i, 1)[0]);
        }
      }
      showQuestion();
    }
    function showQuestion() {
      if (index >= selected.length) {
        showNature();
        return;
      }
      const q = selected[index];
      app.innerHTML = `<div class="screen"><div class="progress">Pregunta ${index + 1} de ${selected.length}</div><div class="qtitle panel"><h1>${esc(q.title)}</h1></div><div class="answers" id="answers"></div></div>`;
      const box = document.getElementById("answers");
      q.responses.forEach((a, i) => {
        const b = document.createElement("button");
        b.className = "answer panel";
        b.innerHTML = esc(a.response);
        b.onmouseenter = () => {
          [...box.children].forEach((x, j) => x.classList.toggle("disabled", j !== i && selectedChoice));
        };
        b.onmouseleave = () => {
          [...box.children].forEach((x) => x.classList.remove("disabled"));
        };
        b.onclick = () => {
          if (selectedChoice) return;
          selectedChoice = true;
          a.scores.forEach((s) => (points[s.nature] += s.points));
          b.classList.add("selected");
          click();
          [...box.children].forEach((x, j) => {
            if (j !== i) x.classList.add("disabled");
          });
          setTimeout(() => {
            selectedChoice = false;
            index++;
            showQuestion();
          }, 240);
        };
        box.appendChild(b);
      });
    }
    function weighted() {
      let w = {};
      NATURES.forEach((n) => (w[n] = maxPoints[n] ? points[n] / maxPoints[n] : 0));
      return w;
    }
    function getBest() {
      const w = weighted();
      let mx = Math.max(...NATURES.map((n) => w[n]));
      return NATURES.filter((n) => w[n] === mx)[0];
    }
    function showNature() {
      bestNature = getBest();
      let parts = DESCRIPTIONS[bestNature]
        .split(".")
        .map((x) => x.trim())
        .filter(Boolean)
        .map((x) => x + ".");
      let i = 0;
      function draw() {
        app.innerHTML = `<div class="screen" id="nature"><div class="nature panel">${esc(parts[i])}</div><div class="tap">Toca o haz clic para continuar<div class="arrow"></div></div></div>`;
        document.getElementById("nature").onclick = () => {
          click();
          i++;
          if (i >= parts.length) showResult();
          else draw();
        };
      }
      draw();
    }
    function loadCover(img, book) {
      img.src = "./files/img/covers/" + book.isbn + ".webp";
      return;
    }
    function chooseBook() {
      const candidates = NATURE_BOOKS[bestNature] || BOOKS.map((_, i) => i);
      return BOOKS[candidates[Math.floor(Math.random() * candidates.length)]];
    }
    function showResult() {
      const book = chooseBook();
      const w = weighted();
      app.innerHTML = `<div class="screen"><div class="result"><div class="resultSide"><div class="resultTitle">${esc(STRINGS.ResultMessage)}</div><div class="bookCard"><div class="coverFrame"><img id="bookCover" class="cover" alt="Portada de ${esc(book.title)}"></div><div class="bookTitle">${esc(book.title)}</div><div class="author">${esc(book.author)}</div><div class="isbn">ISBN ${esc(book.isbn)}</div><div class="bookHint">${esc(book.description)}</div></div><button class="restart" id="restart">↻ ${esc(STRINGS.Restart)}</button></div><div class="resultSide chartSide"><div class="panel"><h2>Tu perfil</h2><div class="sub">Así ha respondido tu personalidad al cuestionario.</div><div class="chartWrap">${chartSvg(w)}</div></div></div></div></div>`;
      loadCover(document.getElementById("bookCover"), book);
      document.getElementById("restart").onclick = () => {
        click();
        modes();
      };
    }
    function chartSvg(w) {
      const cx = 300,
        cy = 300,
        r = 220,
        n = NATURES.length;
      let pts = [];
      for (let i = 0; i < n; i++) {
        let a = -Math.PI / 2 + (i * 2 * Math.PI) / n,
          rr = r * Math.max(0.08, w[NATURES[i]]);
        pts.push([cx + rr * Math.cos(a), cy + rr * Math.sin(a)]);
      }
      let grid = "";
      for (let k = 1; k <= 4; k++) {
        let rr = (r * k) / 4,
          p = [];
        for (let i = 0; i < n; i++) {
          let a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
          p.push(`${cx + rr * Math.cos(a)},${cy + rr * Math.sin(a)}`);
        }
        grid += `<polygon points="${p.join(" ")}" style="fill:none;stroke:rgba(255,255,255,.2);stroke-width:1"/>`;
      }
      let lines = NATURES.map((name, i) => {
        let a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
        return `<line x1="${cx}" y1="${cy}" x2="${cx + r * Math.cos(a)}" y2="${cy + r * Math.sin(a)}"/>`;
      }).join("");
      let labels = NATURES.map((name, i) => {
        let a = -Math.PI / 2 + (i * 2 * Math.PI) / n,
          rr = r + 54;
        return `<text x="${cx + rr * Math.cos(a)}" y="${cy + rr * Math.sin(a)}" font-size="18" font-weight="600" text-anchor="middle" dominant-baseline="middle">${esc(name)}</text>`;
      }).join("");
      return `<svg class="chart" viewBox="0 0 600 600" xmlns="http://www.w3.org/2000/svg">${grid}${lines}<polygon points="${pts.map((p) => p.join(",")).join(" ")}"/>${labels}</svg>`;
    }
    intro();
  </script>
</body>

</html>
